name: One-time fix About googlebot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-googlebot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove remaining Google noindex and clean temporary files
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path("despre-noi.html")
          html = page.read_text(encoding="utf-8")
          pattern = re.compile(
              r'<meta\b(?=[^>]*\bname\s*=\s*["\']googlebot["\'])(?=[^>]*\bcontent\s*=\s*["\'][^"\']*noindex[^"\']*["\'])[^>]*>',
              re.IGNORECASE,
          )
          html, count = pattern.subn('<meta name="googlebot" content="index, follow">', html, count=1)
          if count != 1:
              raise SystemExit("Could not find exactly one googlebot meta tag containing noindex.")
          page.write_text(html, encoding="utf-8")

          for temp in [Path(".seo-index-trigger"), Path(".github/workflows/one-time-fix-about-googlebot.yml")]:
              if temp.exists():
                  temp.unlink()

      - name: Commit final SEO fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(seo): allow Google to index About page"
          git push origin HEAD:main

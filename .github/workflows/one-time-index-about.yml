name: One-time index About page

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  index-about:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Make About page indexable and add to sitemap
        shell: python
        run: |
          from pathlib import Path

          page = Path("despre-noi.html")
          html = page.read_text(encoding="utf-8")
          old = '<meta name="robots" content="noindex, nofollow">'
          new = '<meta name="robots" content="index, follow">'
          if old not in html:
              raise SystemExit("Expected noindex tag was not found; refusing to modify the page blindly.")
          html = html.replace(old, new, 1)
          page.write_text(html, encoding="utf-8")

          sitemap = Path("sitemap.xml")
          xml = sitemap.read_text(encoding="utf-8")
          about_url = "https://www.youngminds.live/despre-noi.html"
          if about_url not in xml:
              entry = "  <url>\n    <loc>https://www.youngminds.live/despre-noi.html</loc>\n    <changefreq>monthly</changefreq>\n    <priority>0.8</priority>\n  </url>\n"
              marker = "</urlset>"
              if marker not in xml:
                  raise SystemExit("Invalid sitemap: closing </urlset> tag not found.")
              xml = xml.replace(marker, entry + marker, 1)
              sitemap.write_text(xml, encoding="utf-8")

          workflow = Path(".github/workflows/one-time-index-about.yml")
          if workflow.exists():
              workflow.unlink()

      - name: Commit SEO fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add despre-noi.html sitemap.xml .github/workflows/one-time-index-about.yml
          git commit -m "fix(seo): make About page indexable"
          git push origin HEAD:main
